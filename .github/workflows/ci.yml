name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build (release)
        run: swift build -c release
      - name: Shell syntax check
        run: bash -n install.sh && bash -n uninstall.sh
